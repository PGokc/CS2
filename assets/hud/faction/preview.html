<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>CS2 Faction Icons</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b1a21; color: white; font: 700 36px system-ui; }
    main { display: flex; gap: 56px; }
    div { display: flex; align-items: center; gap: 14px; }
    img { width: 64px; height: 64px; }
    .t { color: #f5b900; }
    .ct { color: #92919d; }
  </style>
</head>
<body>
  <main>
    <div class="t"><img src="t_logo_gold.svg" alt="T 方">T</div>
    <div class="ct"><img src="ct_logo_gray.svg" alt="CT 方">CT</div>
  </main>
</body>
</html>
